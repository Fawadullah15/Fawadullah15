<svg xmlns="http://www.w3.org/2000/svg" width="820" height="160" viewBox="0 0 820 160">
<style>
@font-face{font-family:"JB";src:url("data:font/woff2;base64,") format("woff2");}
* {
  font-family: "JB", "JetBrains Mono", "Courier New", Courier, monospace;
  box-sizing: border-box;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes slideRight {
  from { opacity:0; transform:translateX(-8px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes pulse {
  0%,100% { opacity:1; }
  50%     { opacity:0.4; }
}
@keyframes glow {
  0%,100% { filter:drop-shadow(0 0 4px #6366F188); }
  50%     { filter:drop-shadow(0 0 12px #6366F1cc); }
}
@keyframes grow {
  from { transform:scaleX(0); transform-origin:left; }
  to   { transform:scaleX(1); transform-origin:left; }
}
.a-up   { animation: fadeUp    0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity:0; }
.a-in   { animation: fadeIn    0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity:0; }
.a-right { animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity:0; }
.a-glow { animation: glow 3s ease-in-out infinite; }
.a-pulse { animation: pulse 2s ease-in-out infinite; }
.a-grow { animation: grow 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform:scaleX(0); }
</style>
<rect width="820" height="160" fill="#09090B"/>
