<svg xmlns="http://www.w3.org/2000/svg" width="820" height="36" viewBox="0 0 820 36">
<style>@font-face{font-family:"JB";src:url("data:font/woff2;base64,") format("woff2");}
@font-face{font-family:"JB";src:local("JetBrains Mono"),local("Courier New");}
*{font-family:"JB","JetBrains Mono","Courier New",Courier,monospace;}
@keyframes slideRight{
  from{opacity:0;transform:translateX(-6px);}
  to{opacity:1;transform:translateX(0);}
}
@keyframes grow{
  from{transform:scaleX(0);transform-origin:left;}
  to{transform:scaleX(1);transform-origin:left;}
}
.a-right{animation:slideRight 0.7s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0;}
.a-grow{animation:grow 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;transform:scaleX(0);transform-origin:left;}</style>
<defs>
  <linearGradient id="ruleF" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3A3A40" stop-opacity="1"/>
    <stop offset="75%" stop-color="#2A2A2F" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#4338CA"/>
  </linearGradient>
</defs>
<rect width="820" height="36" fill="#09090B"/>
<g class="a-right">
  <rect x="0" y="8" width="2" height="20" rx="1" fill="url(#accV)"/>
  <text x="12" y="22" font-size="10" fill="#818CF8"   font-weight="600" letter-spacing="0.18em">TECH STACK</text>
</g>
<line x1="113" y1="18" x2="819" y2="18" stroke="url(#ruleF)" stroke-width="1" class="a-grow"/>
</svg>
