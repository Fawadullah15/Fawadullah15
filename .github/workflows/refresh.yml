name: refresh stats

# Daily at 04:23 UTC. No push trigger (avoids infinite loop).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_LOGIN:     ${{ github.repository_owner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional deps
        run: pip install Pillow --quiet || true

      - name: Generate headings
        run: python3 scripts/gen_headings.py

      - name: Generate hero
        run: python3 scripts/gen_hero.py

      - name: Generate building section
        run: python3 scripts/gen_building.py

      - name: Generate skills
        run: python3 scripts/gen_skills.py

      - name: Generate timeline
        run: python3 scripts/gen_timeline.py

      - name: Generate projects
        run: python3 scripts/gen_projects.py

      - name: Generate stats
        run: python3 scripts/gen_stats.py

      - name: Generate portrait
        run: python3 scripts/gen_portrait.py

      - name: Generate contact
        run: python3 scripts/gen_contact.py

      - name: Commit if changed
        run: |
          git add assets/*.svg
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets [skip ci]"
          git push
