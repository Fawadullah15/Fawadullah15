name: refresh stats

# Runs daily at 04:23 UTC.
# Deliberately has NO push trigger — this job commits files,
# and a push trigger would re-run it on its own commit (infinite loop).
# The [skip ci] suffix on the commit message is a second safety net.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:      # enable the "Run workflow" button in GitHub UI

permissions:
  contents: write         # needed to git push

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_LOGIN:     ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gen_stats.py and gen_projects.py are stdlib-only — no pip install needed.

      - name: Generate SVGs
        run: |
          python3 scripts/gen_hero.py
          python3 scripts/gen_philosophy.py
          python3 scripts/gen_products.py
          python3 scripts/gen_dashboard.py
          python3 scripts/gen_timeline.py

      - name: Commit if changed
        run: |
          git add assets/*.svg
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "stats: auto-refresh [skip ci]"
          git push
