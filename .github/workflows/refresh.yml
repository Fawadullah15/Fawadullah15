name: refresh stats

# Runs daily at 04:23 UTC.
# Deliberately has NO push trigger — this job commits files,
# and a push trigger would re-run it on its own commit (infinite loop).
# The [skip ci] suffix on the commit message is a second safety net.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:      # enable the "Run workflow" button in GitHub UI

permissions:
  contents: write         # needed to git push

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_LOGIN:     ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gen_stats.py and gen_projects.py are stdlib-only — no pip install needed.

      - name: Generate stats SVGs
        run: python3 scripts/gen_stats.py

      - name: Generate project cards SVG
        run: python3 scripts/gen_projects.py

      - name: Commit if changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/langs.svg assets/year.svg assets/projects.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: auto-refresh [skip ci]"
          git push
